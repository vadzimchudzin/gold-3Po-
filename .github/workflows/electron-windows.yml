name: Electron Windows installer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/electron-windows.yml"
      - "electron/**"
      - "assets/**"
      - "build/**"
      - "package.json"
      - "README.md"
      - "RELEASE-TEST-NOTES.md"
      - "server.js"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "market-*.js"
      - "license*.js"
      - "machine-id.js"
      - "research-client.js"
      - "strategy-engine.js"
      - "backtest-engine.js"
      - "risk-engine.js"
      - "adapters/**"
      - "tools/keygen/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "package.json has no version." }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Electron build dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

      - name: Run unit tests and syntax checks
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed." }

      - name: Set up Python for the MT5 connector
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build standalone MT5 connector
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller MetaTrader5
          python -m unittest discover -s adapters/mt5 -p test_mt5_connector.py
          if ($LASTEXITCODE -ne 0) { throw "MT5 connector tests failed." }
          python adapters/mt5/mt5_connector.py --selftest
          python -m PyInstaller --noconfirm --clean --onedir --console --name gold3po-mt5 --hidden-import MetaTrader5 --collect-all numpy --distpath release/mt5-runtime --workpath release/mt5-build --specpath release adapters/mt5/mt5_connector.py
          if (-not (Test-Path release/mt5-runtime/gold3po-mt5/gold3po-mt5.exe)) { throw "Standalone MT5 connector was not created." }

      - name: Stamp the release tag into the build
        shell: pwsh
        run: |
          # The in-app updater compares itself against the published tag. package.json carries only a
          # three-part version, so without this stamp every build looks older than the newest release
          # and offers to reinstall the same installer over the running copy.
          $tag = "v${{ steps.version.outputs.value }}.${{ github.run_number }}"
          @(
            "// Generated by .github/workflows/electron-windows.yml - do not edit by hand.",
            "export const BUILD = { tag: '$tag' };"
          ) | Set-Content -LiteralPath "electron/build-info.js" -Encoding utf8
          Write-Host "Build tag: $tag"

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Electron Windows installer build failed." }

          $installer = Get-ChildItem -Path release -Filter "GOLD-3Po-Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Electron setup executable was not created." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding ascii

          @(
            "GOLD-3Po Market Lab Electron Windows installer",
            "Version: ${{ steps.version.outputs.value }}",
            "Commit: $env:GITHUB_SHA",
            "Target: Windows x64",
            "Framework: Electron",
            "Tests: npm test and npm run check passed before packaging"
          ) | Set-Content -LiteralPath "release\BUILD-INFO.txt" -Encoding utf8

      - name: Build the offline licence generator
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography pyinstaller
          python -m unittest discover -s tools/keygen -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Licence generator tests failed." }

          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GOLD3Po-Keygen --paths tools/keygen --distpath release --workpath release/keygen-build --specpath release/keygen-spec tools/keygen/keygen.py
          if (-not (Test-Path release/GOLD3Po-Keygen.exe)) { throw "Licence generator executable was not created." }

          # Prove the packaged binary signs and verifies on its own, with a throwaway key: the vendor
          # key is never present in CI, so a self-consistent round trip is what can be checked here.
          $pemPath = Join-Path $env:RUNNER_TEMP "keygen-selftest-private.pem"
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; from cryptography.hazmat.primitives import serialization; open(r'$pemPath','w').write(Ed25519PrivateKey.generate().private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()).decode())"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the throwaway key for the keygen smoke test." }
          $reportPath = Join-Path $env:RUNNER_TEMP "keygen-selftest.json"
          $proc = Start-Process -FilePath "release/GOLD3Po-Keygen.exe" -ArgumentList @("--selftest", $pemPath, $reportPath) -PassThru
          if (-not $proc.WaitForExit(120000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "Licence generator smoke test timed out." }
          if (-not (Test-Path $reportPath)) { throw "Licence generator produced no selftest report." }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (-not $report.valid -or $report.tampered -ne "bad_signature" -or $report.other_machine -ne "wrong_machine") {
            throw ("Licence generator smoke test failed: " + (Get-Content $reportPath -Raw))
          }

          $hash = (Get-FileHash -LiteralPath release/GOLD3Po-Keygen.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "release/GOLD3Po-Keygen.exe.sha256" -Value "$hash  GOLD3Po-Keygen.exe" -Encoding ascii

      - name: Install and smoke-test the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "GOLD-3Po-Setup*.exe" | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "GOLD3Po-Electron-Smoke"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw "Electron NSIS installation timed out."
          }
          if ($install.ExitCode -ne 0) {
            throw ("NSIS installer failed with exit code " + $install.ExitCode)
          }

          $appExe = Join-Path $installDir "GOLD-3Po Market Lab.exe"
          if (-not (Test-Path -LiteralPath $appExe)) {
            throw "Installed Electron application executable was not found: $appExe"
          }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "GOLD-3Po Market Lab.lnk"
          if (-not (Test-Path -LiteralPath $desktopShortcut)) {
            throw "Desktop shortcut was not created by the installer: $desktopShortcut"
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($desktopShortcut)
          if ([IO.Path]::GetFullPath($shortcut.TargetPath) -ne [IO.Path]::GetFullPath($appExe)) {
            throw "Desktop shortcut does not target the packaged GOLD-3Po application."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "resources\gold3po-icon.ico"))) {
            throw "The packaged C-3PO icon resource is missing."
          }
          foreach ($adapter in @("Gold3PoBridge.mq5", "Gold3PoLevels.mq5")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir ("resources\adapters\mt5\" + $adapter)))) {
              throw "The packaged MT5 integration source is missing: $adapter"
            }
          }
          $connector = Join-Path $installDir "resources\mt5-runtime\gold3po-mt5\gold3po-mt5.exe"
          if (-not (Test-Path -LiteralPath $connector)) {
            throw "The packaged MT5 connector is missing: $connector"
          }
          $probe = '{"id":1,"op":"ping"}' | & $connector 2>&1
          if ($probe -notmatch '"ok":false' -or $probe -notmatch 'unknown_operation') {
            throw ("The packaged MT5 connector did not answer: " + $probe)
          }

          $stdout = Join-Path $env:RUNNER_TEMP "GOLD3Po-Electron-Smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "GOLD3Po-Electron-Smoke.stderr.log"
          $smoke = Start-Process -FilePath $appExe -ArgumentList @("--smoke-test") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $smoke.WaitForExit(60000)) {
            Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged Electron application smoke test timed out."
          }

          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          if ($smoke.ExitCode -ne 0 -or $out -notmatch "GOLD3PO_ELECTRON_SMOKE_OK") {
            throw ("Packaged Electron application smoke test failed. Exit code: " + $smoke.ExitCode + [Environment]::NewLine + $out + [Environment]::NewLine + $err)
          }

          Write-Host "PASS: installer installs, the packaged MT5 connector runs, and the packaged Electron app starts its local API on port 8787 and serves the UI."

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-3Po-Electron-Windows-Setup-${{ steps.version.outputs.value }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}.${{ github.run_number }}
          name: GOLD-3Po Market Lab v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

